<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pixai 要素ライブラリ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --bg: #0d0d12;
  --surface: #13131b;
  --card: #1b1b27;
  --border: #26263a;
  --border2: #3a3a54;
  --text: #ddd8f0;
  --muted: #6a6680;
  --dim: #3a3650;
  --accent-hair: #f59e0b;
  --accent-eye: #38bdf8;
  --accent-outfit: #a78bfa;
  --accent-pose: #34d399;
  --accent-expr: #f472b6;
  --accent-bg: #fb923c;
  --accent-item: #e2e835;
  --accent-light: #c084fc;
  --selected: #22223a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "top top" "side main";
}

/* ─── TOP BAR ─── */
.topbar {
  grid-area: top;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 20px;
  position: sticky; top: 0; z-index: 100;
}

.logo {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--text);
  white-space: nowrap;
}

.logo span { color: var(--accent-light); }

.search-wrap {
  flex: 1;
  max-width: 360px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 13px;
  padding: 7px 12px 7px 32px;
  outline: none;
  transition: border-color 0.2s;
}

.search-wrap input:focus { border-color: var(--border2); }
.search-wrap input::placeholder { color: var(--muted); }

.search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 13px;
  pointer-events: none;
}

.mood-filter {
  display: flex;
  gap: 6px;
}

.mood-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 11px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.mood-btn:hover { border-color: var(--border2); color: var(--text); }
.mood-btn.on { background: var(--selected); border-color: var(--accent-light); color: var(--accent-light); }

/* ─── SIDEBAR ─── */
.sidebar {
  grid-area: side;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 0;
  position: sticky; top: 56px;
  height: calc(100vh - 56px);
}

.cat-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 20px;
  background: transparent;
  border: none;
  color: var(--muted);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  border-left: 3px solid transparent;
}

.cat-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.cat-btn.active { color: var(--text); background: rgba(255,255,255,0.05); }

.cat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.cat-count {
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--dim);
}

.sidebar-section {
  padding: 16px 20px 8px;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--dim);
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
}

/* ─── MAIN ─── */
.main {
  grid-area: main;
  overflow-y: auto;
  height: calc(100vh - 56px);
  display: flex;
  flex-direction: column;
}

.main-inner {
  flex: 1;
  padding: 24px 24px 0;
}

.cat-section {
  margin-bottom: 36px;
}

.cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.cat-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-family: 'DM Mono', monospace;
}

.cat-count-main {
  font-size: 10px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-left: auto;
}

.tags-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}

.tag-item:hover {
  border-color: var(--border2);
  background: var(--selected);
}

.tag-item.selected {
  border-color: currentColor;
  background: var(--selected);
}

.tag-jp {
  font-size: 12px;
  font-weight: 400;
  display: block;
  line-height: 1.4;
}

.tag-en {
  font-size: 10px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  display: block;
  margin-top: 1px;
  line-height: 1.3;
}

.tag-item.selected .tag-en { color: inherit; opacity: 0.7; }

.mood-badge {
  display: inline-block;
  font-size: 9px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.08em;
  padding: 1px 5px;
  border-radius: 3px;
  margin-top: 3px;
  opacity: 0.7;
}

/* ─── BOTTOM PANEL ─── */
.bottom-panel {
  position: sticky;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 24px;
  z-index: 50;
}

.panel-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.panel-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
}

.panel-actions {
  display: flex;
  gap: 8px;
}

.panel-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  font-size: 11px;
  padding: 4px 12px;
  cursor: pointer;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  transition: all 0.15s;
}

.panel-btn:hover { border-color: var(--border2); color: var(--text); }
.panel-btn.primary {
  background: var(--accent-light);
  border-color: var(--accent-light);
  color: #0d0d12;
  font-weight: 700;
}
.panel-btn.primary:hover { opacity: 0.85; }

.selected-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  min-height: 28px;
  align-items: center;
}

.sel-tag {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--selected);
  border: 1px solid currentColor;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  opacity: 0.9;
}

.sel-tag .remove {
  cursor: pointer;
  opacity: 0.5;
  font-size: 13px;
  line-height: 1;
  margin-left: 2px;
}

.sel-tag .remove:hover { opacity: 1; }

.empty-hint {
  font-size: 12px;
  color: var(--dim);
  font-style: italic;
}

/* コピーモーダル */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  display: none;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 28px;
  width: min(520px, 90vw);
  max-height: 80vh;
  overflow-y: auto;
}

.modal h2 {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 18px;
  color: var(--accent-light);
}

.modal-label {
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
  margin-bottom: 8px;
  margin-top: 16px;
}

.modal-text {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  line-height: 1.8;
  color: var(--text);
  word-break: break-word;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
  justify-content: flex-end;
}

.modal-copy {
  background: var(--accent-light);
  border: none;
  border-radius: 6px;
  color: #0d0d12;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 700;
  font-size: 12px;
  padding: 8px 20px;
  cursor: pointer;
  transition: opacity 0.15s;
}

.modal-copy:hover { opacity: 0.85; }

.modal-close {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-size: 12px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  transition: all 0.15s;
}

.modal-close:hover { border-color: var(--border2); color: var(--text); }

.no-results {
  color: var(--muted);
  font-size: 13px;
  padding: 40px 0;
  text-align: center;
  width: 100%;
}

@media (max-width: 700px) {
  body { grid-template-columns: 1fr; grid-template-areas: "top" "main"; }
  .sidebar { display: none; }
}
</style>
</head>

<!-- TOP BAR -->
<div class="topbar">

    <button class="mood-btn" data-mood="色気" onclick="toggleMood(this)">色気</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

  <button class="cat-btn active" onclick="scrollTo('all')" id="cat-all">

    すべて

    髪

    <span class="cat-dot" style="background:var(--accent-eye)"></span>
    目

  </button>
  <button class="cat-btn" onclick="scrollTo('outfit')" id="cat-outfit">
    <span class="cat-dot" style="background:var(--accent-outfit)"></span>
    衣装
    <span class="cat-count" id="cnt-outfit">0</span>
  </button>
  <button class="cat-btn" onclick="scrollTo('pose')" id="cat-pose">
    <span class="cat-dot" style="background:var(--accent-pose)"></span>
    ポーズ・仕草
    <span class="cat-count" id="cnt-pose">0</span>
  </button>
  <button class="cat-btn" onclick="scrollTo('expression')" id="cat-expression">
    <span class="cat-dot" style="background:var(--accent-expr)"></span>
    表情・感情
    <span class="cat-count" id="cnt-expression">0</span>
  </button>
  <button class="cat-btn" onclick="scrollTo('background')" id="cat-background">
    <span class="cat-dot" style="background:var(--accent-bg)"></span>
    背景・シーン
    <span class="cat-count" id="cnt-background">0</span>
  </button>
  <button class="cat-btn" onclick="scrollTo('item')" id="cat-item">
    <span class="cat-dot" style="background:var(--accent-item)"></span>
    小道具・アイテム
    <span class="cat-count" id="cnt-item">0</span>
  </button>
  <button class="cat-btn" onclick="scrollTo('lighting')" id="cat-lighting">
    <span class="cat-dot" style="background:var(--accent-light)"></span>
    照明・光
    <span class="cat-count" id="cnt-lighting">0</span>
  </button>
</div>

<!-- MAIN -->
<div class="main">
  <div class="main-inner" id="mainInner"></div>

  <!-- BOTTOM PANEL -->
  <div class="bottom-panel">
    <div class="panel-top">
      <span class="panel-label">選択中のタグ (<span id="selCount">0</span>)</span>
      <div class="panel-actions">
        <button class="panel-btn" onclick="clearAll()">クリア</button>
        <button class="panel-btn primary" onclick="openModal()">プロンプトを確認・コピー</button>
      </div>
    </div>
    <div class="selected-tags" id="selectedDisplay">
      <span class="empty-hint">タグをクリックして選択…</span>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">

      <button class="modal-copy" onclick="copyEn()">英語タグをコピー</button>
    </div>
  </div>
</div>

// ─── STATE ───
let selected = {}; // {en: {jp, color}}
let activeMoods = new Set();
let searchQ = '';

// ─── INIT ───
function init() {
  const main = document.getElementById('mainInner');
  main.innerHTML = '';

  let totalVisible = 0;
  CATS.forEach(cat => {
    const filtered = filterTags(cat.tags);
    const el = buildSection(cat, filtered);
    main.appendChild(el);
    document.getElementById(`cnt-${cat.id}`).textContent = filtered.length;
    totalVisible += filtered.length;
  });
  document.getElementById('cnt-all').textContent = totalVisible;
}

function filterTags(tags) {
  return tags.filter(t => {
    const matchSearch = !searchQ ||
      t.jp.includes(searchQ) ||
      t.en.toLowerCase().includes(searchQ.toLowerCase());
    const matchMood = activeMoods.size === 0 ||
      [...activeMoods].some(m => t.moods.includes(m));
    return matchSearch && matchMood;
  });
}

function buildSection(cat, tags) {
  const sec = document.createElement('div');
  sec.className = 'cat-section';
  sec.id = `sec-${cat.id}`;

  sec.innerHTML = `
    <div class="cat-header">
      <span class="cat-dot" style="background:${cat.color}"></span>
      <span class="cat-label" style="color:${cat.color}">${cat.label}</span>
      <span class="cat-count-main">${tags.length}件</span>
    </div>
    <div class="tags-grid" id="grid-${cat.id}"></div>
  `;

  if (tags.length === 0) {
    sec.querySelector('.tags-grid').innerHTML = '<span class="no-results">該当なし</span>';
    return sec;
  }

  const grid = sec.querySelector('.tags-grid');
  tags.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tag-item' + (selected[t.en] ? ' selected' : '');
    div.style.color = cat.color;
    div.innerHTML = `<span class="tag-jp">${t.jp}</span><span class="tag-en">${t.en}</span>`;
    if (t.moods.length > 0) {
      div.innerHTML += `<span class="mood-badge" style="background:${cat.color}22;color:${cat.color}">${t.moods.slice(0,2).join(' · ')}</span>`;
    }
    div.addEventListener('click', () => toggleTag(t.en, t.jp, cat.color));
    grid.appendChild(div);
  });

  return sec;
}

function toggleTag(en, jp, color) {
  if (selected[en]) {
    delete selected[en];
  } else {
    selected[en] = {jp, color};
  }
  updateSelectedPanel();
  // タグの見た目だけ更新
  document.querySelectorAll('.tag-item').forEach(el => {
    const enText = el.querySelector('.tag-en')?.textContent;
    if (enText === en) {
      el.classList.toggle('selected', !!selected[en]);
    }
  });
}

function updateSelectedPanel() {
  const display = document.getElementById('selectedDisplay');
  const count = Object.keys(selected).length;
  document.getElementById('selCount').textContent = count;

  if (count === 0) {
    display.innerHTML = '<span class="empty-hint">タグをクリックして選択…</span>';
    return;
  }

  display.innerHTML = '';
  Object.entries(selected).forEach(([en, {jp, color}]) => {
    const span = document.createElement('span');
    span.className = 'sel-tag';
    span.style.borderColor = color;
    span.style.color = color;
    span.innerHTML = `<span>${jp}</span><span class="remove" onclick="removeTag('${en.replace(/'/g,"\\'")}')">×</span>`;
    display.appendChild(span);
  });
}

function removeTag(en) {
  delete selected[en];
  updateSelectedPanel();
  document.querySelectorAll('.tag-item').forEach(el => {
    if (el.querySelector('.tag-en')?.textContent === en) {
      el.classList.remove('selected');
    }
  });
}

function clearAll() {
  selected = {};
  updateSelectedPanel();
  document.querySelectorAll('.tag-item.selected').forEach(el => el.classList.remove('selected'));
}

function filterAll() {
  searchQ = document.getElementById('searchInput').value.trim();
  init();
}

function toggleMood(btn) {
  const mood = btn.dataset.mood;
  if (activeMoods.has(mood)) { activeMoods.delete(mood); btn.classList.remove('on'); }
  else { activeMoods.add(mood); btn.classList.add('on'); }
  init();
}

function scrollTo(id) {
  if (id === 'all') { document.querySelector('.main').scrollTo({top:0, behavior:'smooth'}); return; }
  const el = document.getElementById(`sec-${id}`);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function openModal() {
  if (Object.keys(selected).length === 0) { alert('タグを選択してください'); return; }
  const enTags = Object.keys(selected).join(', ');
  const jpList = Object.values(selected).map(v=>v.jp).join('　/　');
  document.getElementById('modalEn').textContent = enTags;
  document.getElementById('modalJp').textContent = jpList;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

async function copyEn() {
  const text = document.getElementById('modalEn').textContent;
  await navigator.clipboard.writeText(text);
  const btn = document.querySelector('.modal-copy');
  btn.textContent = 'コピーしました！';
  setTimeout(() => btn.textContent = '英語タグをコピー', 2000);
}

// モーダル外クリックで閉じる
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

init();
</script>
